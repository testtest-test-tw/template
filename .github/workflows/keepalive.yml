# Supabase 免費專案一週沒有人使用會自動暫停。
# 這個排程每天呼叫一次前台資料，讓資料庫保持開啟。
# 連線資訊直接讀 config.js（本來就是公開的值），不需要另外設定 Secrets。
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 1 * * *'   # 每天台灣時間 09:17
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          key=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js 尚未填入 Supabase 連線資訊"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url/rest/v1/rpc/public_board" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
