# Supabase 免費專案一週沒有人使用會自動暫停。
# 這個排程每天呼叫一次前台資料，讓資料庫保持開啟。
# 需要在 GitHub 專案 Settings → Secrets and variables → Actions 新增：
#   SUPABASE_URL、SUPABASE_ANON_KEY
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 1 * * *'   # 每天台灣時間 09:17
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/public_board" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
