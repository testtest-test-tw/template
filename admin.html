<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>選屋後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form">
    <h1>選屋系統 · 登入</h1>
    <p class="hint" id="login-case" style="margin:0"></p>
    <label class="f">Email<input id="lg-email" type="email" autocomplete="username" required></label>
    <label class="f">密碼<input id="lg-pw" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err" role="alert"></div>
    <button class="btn pri" type="submit" id="lg-btn">登入</button>
    <p class="hint" style="margin:0">帳號由管理員在 Supabase 建立。忘記密碼請聯絡管理員重設。</p>
  </form>
</div>

<div id="app" hidden>
  <div class="topbar">
    <button class="btn sm menu-btn" id="menu" aria-label="開啟選單">☰</button>
    <b>選屋系統</b><span class="case" id="case-name"></span><span class="demo" id="test-flag" hidden>測試模式</span>
    <span class="sp"></span><span class="user" id="who"></span><button class="btn sm" id="logout">登出</button>
  </div>
  <div class="app">
    <aside class="side" id="side">
      <div class="prog">
        <p class="h">選配進度</p>
        <div class="r"><span>完成選屋</span><b id="p-done"></b></div>
        <div class="meter"><i id="p-bar"></i></div>
        <div class="r"><span>重複待抽籤</span><b id="p-dup"></b></div>
        <div class="r"><span>收件未齊</span><b id="p-doc"></b></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot"><nav id="nav2"></nav></div>
    </aside>
    <main id="main"></main>
  </div>
  <div class="drawer" id="drawer" aria-live="polite"></div>
</div>
<div id="modal-root"></div>
<div class="busy" id="busy" hidden><div id="busy-t">處理中…</div></div>
<script src="admin.js"></script>
</body>
</html>
