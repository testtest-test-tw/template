<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地主選屋資訊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="config.js"></script>
<style>
:root{
  --paper:#F4F6F5; --card:#FFFFFF; --ink:#1B2F38; --ink2:#4A5E67; --ink3:#7D8E95; --line:#D7DFE1;
  --accent:#2C6680; --accent-soft:#E3EEF2;
  --sel:#2F7A5A; --sel-bg:#DDEFE6; --dup:#B5452F; --dup-bg:#F7E1DA; --open:#FFFFFF; --open-line:#AFC0C6;
  --res:#C9D0D3; --plan-filter:none; --hero:#1E3A47; --hero-ink:#F2F6F7;
  --warn-bg:#FFF3D6; --warn-ink:#7A5410;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --paper:#11191D; --card:#18242A; --ink:#E5ECEE; --ink2:#AEBCC2; --ink3:#7F9097; --line:#2C3B42;
  --accent:#7DB7CF; --accent-soft:#1E3441;
  --sel:#6FC39C; --sel-bg:#1D3A2E; --dup:#F08A72; --dup-bg:#44231B; --open:#18242A; --open-line:#4B5F67;
  --res:#3A474D; --plan-filter:invert(.9) hue-rotate(180deg); --hero:#0E2530; --hero-ink:#E8F0F2;
  --warn-bg:#3A2F14; --warn-ink:#F1D08A;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.testbar{background:var(--warn-bg);color:var(--warn-ink);font-size:14px;text-align:center;padding:8px 16px}
header.hero{background:var(--hero);color:var(--hero-ink);padding-block:28px 26px}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.eyebrow{font-size:13px;letter-spacing:.12em;opacity:.75}
h1{font-family:var(--serif);font-size:clamp(24px,4vw,34px);line-height:1.3;margin:6px 0 6px;text-wrap:balance}
.sub{font-size:15px;opacity:.85;margin:0}
.count{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:14px 18px;min-width:220px}
.count .lbl{font-size:13px;opacity:.8}
.count .big{font-family:var(--mono);font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums}
.count .big small{font-family:var(--sans);font-size:15px;margin-left:2px}
.count .dl{font-size:13px;opacity:.8}
.steps{display:flex;margin-top:22px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:110px;font-size:13px;border-top:3px solid rgba(255,255,255,.2);padding-top:8px;padding-right:10px}
.step b{display:block;font-size:14px}
.step.done{border-color:rgba(255,255,255,.55)}
.step.now{border-color:#8FD3B3}.step.now b{color:#A9E3C8}
.step span{opacity:.75}
main{padding-block:28px 40px;display:grid;gap:28px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
h2{font-family:var(--serif);font-size:22px;margin:0}
.upd{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sel);animation:pulse 2s infinite}
.dot.off{background:var(--dup);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sel) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:16px;font-weight:500;border:0;background:transparent;color:var(--ink2);padding:7px 16px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:15px;border:0;background:var(--card);color:var(--ink2);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--ink2);margin:4px 0 14px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px;border:1.5px solid transparent}
.lg-sel{background:var(--sel)}.lg-dup{background:var(--dup)}.lg-open{background:var(--open);border-color:var(--open-line)!important}.lg-res{background:repeating-linear-gradient(45deg,var(--res) 0 3px,transparent 3px 6px);border-color:var(--res)!important}
.grid-scroll{overflow-x:auto}
table.g{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
table.g th{font-size:13px;color:var(--ink3);font-weight:500;padding:0 2px}
table.g th.fl{text-align:right;padding-right:6px;font-family:var(--mono);font-size:13px}
.u{display:block;width:46px;height:30px;border-radius:5px;border:1.5px solid var(--open-line);background:var(--open);color:var(--ink2);font:500 12px var(--mono);cursor:pointer;padding:0}
.u.s1{background:var(--sel);border-color:var(--sel);color:#fff}
.u.s2{background:var(--dup);border-color:var(--dup);color:#fff}
.u.s3{background:repeating-linear-gradient(45deg,var(--res) 0 3px,transparent 3px 6px);border-color:var(--res);color:var(--ink3)}
.u.on{outline:3px solid var(--accent);outline-offset:1px}
.pk-floor{margin-bottom:16px}
.pk-floor h3{font-size:15px;margin:0 0 6px;color:var(--ink2);font-weight:500}
.pk-wrap{display:flex;flex-wrap:wrap;gap:3px}
.pk-wrap .u{width:40px;height:26px;font-size:11px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.plan-box{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:auto;max-height:78vh}
.plan-inner{position:relative;width:100%}
.plan-inner.z2{width:190%}
.plan-inner img{display:block;width:100%;height:auto;max-width:none;filter:var(--plan-filter)}
.plan-inner svg{position:absolute;inset:0;width:100%;height:100%}
.hot{cursor:pointer}
.hot text{font-family:var(--mono);font-weight:600;pointer-events:none}
.plan-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.panel{border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:12px;background:var(--card)}
.panel .code{font:600 26px var(--mono)}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:2px 10px;border-radius:99px}
.p1{background:var(--sel-bg);color:var(--sel)}.p2{background:var(--dup-bg);color:var(--dup)}.p0{background:var(--accent-soft);color:var(--accent)}.p3{background:var(--paper);color:var(--ink3);border:1px solid var(--line)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:15px}
dl.kv dt{color:var(--ink3)} dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink3);margin:10px 0 0}
.note{font-size:13px;color:var(--ink3);margin-top:12px}
.ann{display:grid;gap:12px}
.ann article{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.ann h3{font-size:17px;margin:0}
.ann time{font-size:13px;color:var(--ink3);font-family:var(--mono)}
.ann p{margin:4px 0 0;white-space:pre-wrap;color:var(--ink2)}
.lookup{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:15px;color:var(--ink2)}
.field input{font:inherit;font-size:17px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-size:17px;padding:10px 22px}
.result{border:1px solid var(--line);border-radius:10px;padding:18px;min-height:150px}
.result h3{font-size:20px;margin:0 0 4px}
.res-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.res-row:last-child{border-bottom:0}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.docs span{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink2)}
.docs span.ok{background:var(--sel-bg);border-color:transparent;color:var(--sel)}
.err{color:var(--dup)}
.loading{padding:40px;text-align:center;color:var(--ink3)}
footer{font-size:13px;color:var(--ink3);padding-block:0 32px}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.panel{position:static}.lookup{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="testbar" id="testbar" hidden>⚠️ 測試頁面：資料僅供測試，非正式選屋結果</div>
<header class="hero">
  <div class="wrap">
    <div class="hero-grid">
      <div>
        <div class="eyebrow" id="eyebrow">都市更新權利變換</div>
        <h1 id="title">地主選屋資訊</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="count" aria-live="polite">
        <div class="lbl" id="cd-lbl">申請分配期間</div>
        <div class="big" id="cd">—</div>
        <div class="dl" id="cd-dl"></div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </div>
</header>

<main class="wrap">
  <section class="card" id="ann-sec" hidden aria-labelledby="ann-h">
    <div class="sec-head"><h2 id="ann-h">最新公告</h2></div>
    <div class="ann" id="ann"></div>
  </section>

  <section class="card" aria-labelledby="st-h">
    <div class="sec-head">
      <h2 id="st-h">即時選屋狀態</h2>
      <div class="upd"><span class="dot" id="dot"></span><span id="upd">載入中…</span><button class="btn" id="reload" style="font-size:13px;padding:4px 10px">重新載入</button></div>
    </div>
    <div class="controls">
      <div class="tabs" role="tablist" aria-label="區域" id="tabs"></div>
      <div class="seg" aria-label="顯示方式" id="seg">
        <button data-v="plan" aria-pressed="true">平面圖</button>
        <button data-v="table" aria-pressed="false">銷控表</button>
      </div>
    </div>
    <div class="legend">
      <span><i class="lg-sel"></i>已選配</span>
      <span><i class="lg-dup"></i>重複選配，待抽籤</span>
      <span><i class="lg-open"></i>尚未選配</span>
      <span><i class="lg-res"></i>不開放選配</span>
    </div>
    <div class="split">
      <div id="view"><div class="loading">資料載入中…</div></div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>

  <section class="card" aria-labelledby="lk-h">
    <div class="sec-head"><h2 id="lk-h">查詢我的選配結果</h2></div>
    <div class="lookup">
      <form id="lk" autocomplete="off">
        <div class="field"><label for="lk-name">姓名</label><input id="lk-name" required></div>
        <div class="field"><label for="lk-id">身分證字號</label><input id="lk-id" required maxlength="10" autocapitalize="characters"></div>
        <button class="btn primary" type="submit" id="lk-btn">查詢</button>
      </form>
      <div class="result" id="lk-res"><p class="hint" style="margin:0">輸入姓名與身分證字號後，會顯示您登記的戶別、車位與文件收件進度。資料以加密方式傳輸，不留存查詢紀錄。</p></div>
    </div>
  </section>
</main>
<footer class="wrap" id="footer"></footer>

<script>
const C=window.APP_CONFIG||{};
const API=(fn,body)=>fetch(`${C.SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'apikey':C.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('zh-TW');
const f2=n=>n?Number(n).toFixed(2):'—';
const fnum=f=>{const m=String(f).match(/^B(\d+)$/);return m?-+m[1]:parseInt(f)};
const LBL=['尚未選配','已選配','重複選配，待抽籤','不開放選配'];

let B=null, PL=null, UN={}, PK={}, TABS=[];
const st={k:null,v:'plan',fl:null,pf:null,sel:null,zoom:false};
const S=c=>{const n=(B&&B.status[c])||0;return n<0?3:n>=2?2:n};
const cls=c=>'u s'+S(c)+(st.sel===c?' on':'');

function buildIndex(){
  UN={};PK={};B.units.forEach(u=>UN[u.code]=u);B.parking.forEach(p=>PK[p.code]=p);
  const towers=[...new Set(B.units.filter(u=>u.use==='住宅').map(u=>u.unit.replace(/\d+$/,'')))].sort();
  TABS=towers.map(t=>({k:t,label:t+' 棟'}));
  if(B.units.some(u=>u.use!=='住宅'))TABS.push({k:'SHOP',label:'一樓店鋪'});
  if(B.parking.length)TABS.push({k:'P',label:'車位'});
  if(!st.k)st.k=TABS[0]&&TABS[0].k;
}
const typesOf=k=>[...new Set(B.units.filter(u=>k==='SHOP'?u.use!=='住宅':u.use==='住宅'&&u.unit.replace(/\d+$/,'')===k).map(u=>u.unit))].sort((a,b)=>a.localeCompare(b,'en',{numeric:true}));
const floorsOf=k=>[...new Set(B.units.filter(u=>k==='SHOP'?u.use!=='住宅':u.use==='住宅'&&u.unit.replace(/\d+$/,'')===k).map(u=>u.floor))].sort((a,b)=>fnum(b)-fnum(a));
const pfloors=()=>[...new Set(B.parking.map(p=>p.floor))].sort((a,b)=>fnum(a)-fnum(b));

function renderHead(){
  const s=B.settings;
  document.title=(s.short_name||'')+' 地主選屋資訊';
  $('#testbar').hidden=!s.test_mode;
  $('#eyebrow').textContent=[s.location,'都市更新權利變換'].filter(Boolean).join(' · ');
  $('#title').textContent=(s.short_name||'')+' 地主選屋資訊';
  $('#subtitle').textContent=[s.developer?'實施者 '+s.developer:'',s.case_name].filter(Boolean).join(' · ');
  $('#steps').innerHTML=(s.milestones||[]).map(m=>`<div class="step ${m.status||''}"><b>${esc(m.name)}</b><span>${esc(m.date||'')}</span></div>`).join('');
  $('#footer').innerHTML=`${s.contact?'服務專線 '+esc(s.contact)+' · ':''}本頁資料僅供選配參考，實際以都市更新審議及核准建照為準 · ${esc(C.COMPANY||'')}`;
  const a=B.announcements||[]; $('#ann-sec').hidden=!a.length;
  $('#ann').innerHTML=a.slice(0,5).map(x=>`<article><time>${esc(x.date)}</time><h3>${esc(x.title)}</h3>${x.content?`<p>${esc(x.content)}</p>`:''}</article>`).join('');
  tick();
}
function tick(){
  if(!B)return; const s=B.settings;
  const start=s.apply_start?new Date(s.apply_start+'T00:00:00+08:00'):null, end=s.apply_end?new Date(s.apply_end+'T'+(s.apply_end_time||'17:00')+':00+08:00'):null;
  const now=Date.now(); let lbl,big,dl='';
  const roc=d=>`${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  if(!end){lbl='申請分配期間';big='籌備中';}
  else if(start&&now<start){const ms=start-now;lbl='距申請分配開始';big=`${Math.floor(ms/864e5)}<small>天</small> ${String(Math.floor(ms%864e5/36e5)).padStart(2,'0')}<small>時</small>`;dl='開始：'+roc(start);}
  else if(now<end){const ms=end-now;lbl='距申請分配截止';big=`${Math.floor(ms/864e5)}<small>天</small> ${String(Math.floor(ms%864e5/36e5)).padStart(2,'0')}<small>時</small>`;dl=`截止：${roc(end)} ${s.apply_end_time||'17:00'}`;}
  else{lbl='申請分配期間';big='已截止';dl=s.lottery_text?'公開抽籤：'+s.lottery_text:'截止：'+roc(end);}
  $('#cd-lbl').textContent=lbl;$('#cd').innerHTML=big;$('#cd-dl').textContent=dl;
}
function render(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-k="${t.k}" aria-selected="${t.k===st.k}">${t.label}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{st.k=t.dataset.k;st.sel=null;render()});
  const showPlan=B.settings.show_plans!==false&&PL;
  $('#seg').hidden=!showPlan; if(!showPlan)st.v='table';
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.v));
  const v=$('#view');
  v.innerHTML = st.v==='plan'?planView():(st.k==='P'?parkTable():towerTable(st.k));
  bind(); panel();
}
function towerTable(k){
  const T=typesOf(k),F=floorsOf(k);
  let h='<div class="grid-scroll"><table class="g"><tr><th></th>'+T.map(t=>`<th>${t}</th>`).join('')+'</tr>';
  F.forEach(f=>{h+=`<tr><th class="fl">${f}</th>`+T.map(t=>{const c=f+'-'+t;return UN[c]?`<td><button class="${cls(c)}" data-c="${c}" aria-label="${c} ${LBL[S(c)]}">${t}</button></td>`:'<td></td>'}).join('')+'</tr>'});
  return h+'</table></div>';
}
function parkTable(){
  return pfloors().map(f=>{const list=B.parking.filter(p=>p.floor===f);
    return `<div class="pk-floor"><h3>${f} · ${list.length} 位</h3><div class="pk-wrap">`+list.map(p=>`<button class="${cls(p.code)}" data-c="${p.code}" aria-label="${p.code} ${LBL[S(p.code)]}">${p.code.split('-').pop()}</button>`).join('')+'</div></div>';}).join('');
}
function planView(){
  let flOpts,cur;
  if(st.k==='P'){flOpts=pfloors();cur=st.pf=st.pf&&flOpts.includes(st.pf)?st.pf:flOpts[flOpts.length-1];}
  else{flOpts=floorsOf(st.k);cur=st.fl&&flOpts.includes(st.fl)?st.fl:(flOpts.includes('9F')?'9F':flOpts[Math.floor(flOpts.length/2)]);if(st.k!=='SHOP')st.fl=cur;}
  const key=PL.floors[cur],pl=key&&PL.images[key];
  const sel=flOpts.length>1?`<label for="flsel" style="font-size:15px;color:var(--ink2)">樓層</label><select id="flsel">${flOpts.map(f=>`<option ${f===cur?'selected':''}>${f}</option>`).join('')}</select>`:`<span style="font-size:15px;color:var(--ink2)">${cur}</span>`;
  if(!pl)return `<div class="plan-tools">${sel}</div><p class="hint">這一層沒有平面圖，請切換到「銷控表」。</p>`;
  const isP=st.k==='P';
  const pts=pl.pts.filter(p=>isP||st.k==='SHOP'||p[0].replace(/\d+$/,'')===st.k);
  let svg=`<svg viewBox="0 0 ${pl.w} ${pl.h}" role="group" aria-label="${cur} 平面圖">`;
  pts.forEach(p=>{
    const code=isP?p[0]:cur+'-'+p[0]; if(!UN[code]&&!PK[code])return; const s=S(code);
    const fill=['var(--open)','var(--sel)','var(--dup)','var(--res)'][s], stroke=['var(--accent)','var(--sel)','var(--dup)','var(--res)'][s], tc=s===1||s===2?'#fff':'var(--ink)';
    const lab=isP?p[0].split('-').pop():p[0], w=isP?(lab.length>2?40:32):48, h=isP?24:28, on=st.sel===code;
    svg+=`<g class="hot" tabindex="0" data-c="${code}" role="button" aria-label="${code} ${LBL[s]}"><rect x="${p[1]-w/2}" y="${p[2]-h/2}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${on?'#E0A800':stroke}" stroke-width="${on?5:2}"/><text x="${p[1]}" y="${p[2]+4.5}" text-anchor="middle" fill="${tc}" font-size="${isP?12:14}">${lab}</text></g>`;
  });
  svg+='</svg>';
  const shared=Object.entries(PL.floors).filter(([,v])=>v===key).map(([k])=>k);
  const same=!isP&&shared.length>2?`<span class="hint" style="margin:0">${shared[0]}–${shared[shared.length-1]} 為標準層，格局相同</span>`:'';
  return `<div class="plan-tools">${sel}<button class="btn" id="zm">${st.zoom?'縮小':'放大'}</button>${same}</div>
  <div class="plan-box"><div class="plan-inner${st.zoom?' z2':''}"><img src="${pl.file}" alt="${cur} 平面圖" width="${pl.w}" height="${pl.h}">${svg}</div></div>
  <p class="note">圖說取自選屋圖冊，實際以都更審議及核准建照為準。</p>`;
}
function panel(){
  const c=st.sel,p=$('#panel');
  if(!c){p.innerHTML='<p class="hint" style="margin:0">點選平面圖或銷控表上的戶別、車位，查看詳細資料。</p>';return}
  const s=S(c),price=v=>v!=null?`<dt>價格</dt><dd>NT$${fmt(v)}</dd>`:'';
  const msg=s===2?'此位置有兩位以上地主選配，將於公開抽籤決定。':s===1?'此位置已有地主登記選配。':s===3?'此位置不開放地主選配。':'此位置目前可登記選配，請洽服務人員。';
  const who=B.names&&B.names[c]?`<dt>選配人</dt><dd>${esc(B.names[c])}</dd>`:'';
  if(UN[c]){const u=UN[c];
    p.innerHTML=`<div class="code">${c}</div><span class="pill p${s}">${LBL[s]}</span>
    <dl class="kv"><dt>用途</dt><dd>${esc(u.use)}</dd><dt>主建物</dt><dd>${f2(u.main)} 坪</dd><dt>附屬建物</dt><dd>${f2(u.aux)} 坪</dd><dt>共有部分</dt><dd>${f2(u.common)} 坪</dd>
    <dt><b>總建物面積</b></dt><dd><b>${f2(u.total)} 坪</b></dd>${u.terrace?`<dt>露臺</dt><dd>${f2(u.terrace)} 坪</dd>`:''}${price(u.price)}${who}</dl><p class="hint">${msg}</p>`;
  }else if(PK[c]){const k=PK[c];
    p.innerHTML=`<div class="code">${c}</div><span class="pill p${s}">${LBL[s]}</span>
    <dl class="kv"><dt>樓層</dt><dd>${k.floor}</dd><dt>類型</dt><dd>${esc(k.type)}</dd><dt>尺寸</dt><dd>${esc(k.size)}</dd>${price(k.price)}${who}</dl><p class="hint">${msg}</p>`;}
}
function bind(){
  document.querySelectorAll('[data-c]').forEach(el=>{const go=()=>{st.sel=el.dataset.c;render()};el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  const fs=$('#flsel');if(fs)fs.onchange=e=>{if(st.k==='P')st.pf=e.target.value;else st.fl=e.target.value;render()};
  const zm=$('#zm');if(zm)zm.onclick=()=>{st.zoom=!st.zoom;render()};
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{st.v=b.dataset.v;render()});

async function load(first){
  try{
    const b=await API('public_board');B=b;buildIndex();
    if(first)renderHead();else{renderHead()}
    render();
    $('#dot').className='dot';$('#upd').textContent=`每 ${B.settings.refresh_sec||30} 秒自動更新 · 最後更新 ${new Date().toLocaleTimeString('zh-TW',{hour12:false})}`;
  }catch(e){
    $('#dot').className='dot off';$('#upd').textContent='暫時無法連線，稍後自動重試';
    if(!B)$('#view').innerHTML='<div class="loading">暫時無法取得資料，請稍後按「重新載入」。</div>';
  }
}
let timer;
async function start(){
  try{PL=await fetch('plans/plans.json').then(r=>r.ok?r.json():null)}catch(e){PL=null}
  await load(true);
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&!document.querySelector('.plan-box:hover'))load()},(B&&B.settings.refresh_sec||30)*1000);
  setInterval(tick,60000);
}
$('#reload').onclick=()=>load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

$('#lk').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('#lk-name').value.trim(),i=$('#lk-id').value.trim().toUpperCase(),r=$('#lk-res');
  $('#lk-btn').disabled=true;r.innerHTML='<p class="hint" style="margin:0">查詢中…</p>';
  let o=null;try{o=await API('verify_owner',{p_name:n,p_id:i})}catch(err){r.innerHTML='<p class="err" style="margin:0">暫時無法連線，請稍後再試。</p>';$('#lk-btn').disabled=false;return}
  $('#lk-btn').disabled=false;
  const contact=B&&B.settings.contact?`，或致電 ${esc(B.settings.contact)} 洽詢`:'';
  if(!o){r.innerHTML=`<p class="err" style="margin:0">查不到符合的資料。請確認姓名與身分證字號是否正確${contact}。</p>`;return}
  const stl=o.participation==='不參與'?['不參與權變（領補償金）','p3']:o.redo?['需重新選配','p2']:(o.units.length||o.parks.length||o.groups.length)?[o.formal||o.groups.length?'已登記選配':'登記中（尚未正式登錄）','p1']:['尚未申請選配','p0'];
  let h=`<h3>${esc(o.name)}</h3><span class="pill ${stl[1]}">${stl[0]}</span>`;
  h+=`<div class="res-row" style="margin-top:10px"><span>更新後應分配權利價值</span><b>NT$${fmt(o.value)}</b></div>`;
  if(o.units.length||o.parks.length)h+=`<div class="res-row"><span>選配房屋</span><b>${o.units.join('、')||'—'}</b></div><div class="res-row"><span>選配車位</span><b>${o.parks.join('、')||'—'}</b></div>`;
  o.groups.forEach(g=>{h+=`<div class="res-row"><span>合併對象</span><span>${esc(g.with)}</span></div><div class="res-row"><span>合併選配</span><b>${g.codes.join('、')}</b></div><div class="res-row"><span>您的出資</span><span>NT$${fmt(g.amount)} ／ 總價 NT$${fmt(g.total)}</span></div>`});
  if(o.dups.length)h+=`<p class="err">${o.dups.join('、')} 與其他地主重複選配，將於公開抽籤決定${B.settings.lottery_text?'（'+esc(B.settings.lottery_text)+'）':''}。</p>`;
  if(o.redo)h+='<p class="err">您選配的位置經抽籤未中，請依抽出的順位重新選配。</p>';
  if(!o.units.length&&!o.parks.length&&!o.groups.length&&o.participation!=='不參與')h+=`<p class="hint">${o.below_min?'您的應分配權利價值未達最小分配單元，可選擇領取補償金，或與其他地主合併申請分配。':''}${B.settings.apply_end?'請於申請分配截止前繳回文件。':''}</p>`;
  if(o.docs.length)h+='<div class="docs">'+o.docs.map(d=>`<span class="${d.state===2?'ok':''}">${d.state===2?'✓ ':d.state===1?'◐ ':''}${esc(d.name)}${d.state===1?'（已收到，處理中）':''}</span>`).join('')+'</div>';
  h+='<p class="note">找補金額以正式權利變換計畫為準，請洽服務人員。</p>';
  r.innerHTML=h;
});
if(!C.SUPABASE_URL||C.SUPABASE_URL.includes('YOUR-')){$('#view').innerHTML='<div class="loading">尚未設定資料庫連線：請編輯 config.js 填入 Supabase 的網址與 anon key。</div>';$('#upd').textContent='未連線';}
else start();
</script>
</body>
</html>
